[project]
name = "tf-ia-huellas-voz"
version = "0.0.0"
description = "Sistema de reconocimiento de huellas dactilares controlado por reconocimiento de voz (TF Inteligencia Artificial I, UNCuyo, 2026)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = '-m "not aceptacion"'
markers = [
    "aceptacion: metas de la sección 1.3 del plan sobre el dataset completo (lento; se corre con pytest -m aceptacion)",
]
