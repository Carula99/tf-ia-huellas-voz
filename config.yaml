# Configuración única del proyecto: semillas, rutas, tamaños e hiperparámetros.
# La lee src/config.py (cargar_config). Contrato: docs/contratos/fase0_setup.md, sección 7.
# Las rutas son relativas a la raíz del repo y usan "/".
# Ojo con los números: PyYAML lee 1e-9 como texto; hay que escribir 1.0e-9.

semilla_global: 2026

rutas:
  datos: data
  huellas: data/huellas
  voz: data/voz
  modelos: models
  figuras: docs/figuras

huellas:
  # Identidades autorizadas: una semilla fija por identidad.
  identidades:
    - id: 1
      nombre: "Identidad Sintética #1"
      tipo: presilla
      semilla: 101
    - id: 2
      nombre: "Identidad Sintética #2"
      tipo: verticilo
      semilla: 202
    - id: 3
      nombre: "Identidad Sintética #3"
      tipo: arco_tienda
      semilla: 303
  variantes_por_identidad: 40
  particion:                # por identidad autorizada
    train: 24
    val: 8
    test: 8
  reservadas_demo: 2        # salen de las 8 de test y nunca se usan para calibrar
  intrusos:
    cantidad: 60
    variantes_por_intruso: 3
    semilla_base: 10000     # el intruso i (1 a 60) usa semilla_base + i
    val: 30                 # identidades intrusas solo en validación (calibran el umbral)
    test: 30                # identidades intrusas solo en test
    tipos: [presilla, verticilo, arco_tienda, arco]   # el intruso i es del tipo tipos[(i - 1) % 4]
  generador:                # H1: síntesis de las huellas base (contrato h1_generador.md)
    tamano_px: [400, 320]   # (alto, ancho) de cada imagen
    periodo_base_px: [8.7, 9.3]   # rango del período de las crestas de cada base
    iteraciones: 15         # pasadas del filtrado de Gabor
    orientaciones: 16       # filtros del banco de Gabor
  variantes:                # rangos máximos de las variantes de H1
    rotacion_max_grados: 15
    traslacion_max_px: 15
    escala_max: 0.08
    corte_periferico: [0.05, 0.10]   # hasta el 10 % (pedido del profesor); fracción del área, sin tocar el núcleo
    prob_corte: 0.3         # probabilidad de que una variante tenga corte periférico
    elastica_max_px: 3.0    # amplitud máxima de la deformación elástica
    presion_max: 0.7        # mezcla máxima con la erosión (+) o con la dilatación (−)
    ruido_sigma_max: 10.0   # desvío máximo del ruido gaussiano, en niveles de gris
    sal_pimienta_max: 0.01  # fracción máxima de píxeles llevados a 0 o a 255
  ventana_px: [250, 250]    # (alto, ancho) de la ventana de H2, sin reescalar
  periodo_crestas_px: [8, 10]
  preprocesamiento:         # H2 (contrato h2_preprocesamiento.md)
    mediana_px: 3           # lado del filtro de mediana (sal y pimienta)
    umbral_segmentacion: 0.55   # fracción del percentil 95 de la energía local
    sigma_tensor_px: 3.0    # suavizado del tensor de estructura para buscar singularidades
    sigma_ajuste_px: 5.0    # suavizado del campo del ajuste y de la ventana
    radio_poincare_px: 6.0  # radio del círculo del índice de Poincaré
    margen_singularidades_px: 24.0   # se descartan singularidades más cerca del borde de la máscara
    holgura_nucleo_px: 6.0  # cuánto puede mover el ajuste cada núcleo detectado
    clahe_limite: 2.0       # límite de contraste de CLAHE
    clahe_grilla: 8         # celdas por lado de CLAHE
  caracteristicas:          # H3 (contrato h3_caracteristicas.md)
    grilla_orientacion: 5   # celdas por lado de la grilla de orientación
    cobertura_min: 0.5      # fijo: zona con menos huella que esto → NaN (se imputa)
    gabor_periodos_px: [8.0, 10.0]
    gabor_orientaciones: 6
    anillos_gabor_px: [20.0, 50.0, 80.0, 110.0]
    sectores_gabor: 8
    erosion_gabor_px: 10.0  # Gabor solo a esta distancia del borde de la máscara
    borde_minucia_px: 14.0  # fijo: minucias más cerca del borde de la máscara → se descartan
    componente_min_px: 20   # componentes del esqueleto más chicas → afuera
    espuela_px: 12          # largo máximo de una espuela
    par_terminaciones_px: 10.0
    par_bifurcaciones_px: 8.0
    anillos_minucias_px: [0.0, 40.0, 75.0, 110.0]
    grilla_minucias: 4
  kmeans:
    k: 3
    n_init: 15
    max_iter: 300
    tol: 1.0e-4
  umbral:
    criterio: eer           # eer o far_max
    far_max_val: 0.05       # se usa si criterio = far_max

voz:
  frecuencia_muestreo: 16000
  comandos: [reconocer, identificar, salir]
  clase_rechazo: otro
  duracion_palabra_s: [0.3, 2.5]
  push_to_talk_max_s: 3.0
  pasabanda_hz: [80, 4000]
  preenfasis: 0.97
  mfcc:
    n_mfcc: 13
    n_mels: 40
    fmax: 4000
    ventana_ms: 25
    avance_ms: 10
  tramos: 5
  knn:
    k_candidatos: [3, 5, 7, 9]
    eps: 1.0e-9
    confianza_min: 0.60
    pca_componentes_candidatas: [20, 30]
  dataset:                  # V1: dataset de voz (contrato v1_dataset.md, sección 2)
    clip_max_s: 3.0         # igual a push_to_talk_max_s
    saturacion: 0.98        # nivel que cuenta como tope
    saturacion_frac: 0.01   # un clip con más del 1 % de las muestras en el tope está saturado
    mismo_hablante: [[p01, p02], [p09, p13], [p14, p17]]   # códigos que son la misma persona
    particiones:            # por hablante; los no fijos se sortearon con semilla_global (contrato, sección 2)
      train: [p01, p02, p06, p07, p08, p09, p10, p11, p12, p13, p14, p15, p17,
              p22, p23, p24, p25, p26, p27, p28, p29]
      val: [p03, p04, p20, p21]
      test: [p05, p16, p18, p19]
    min_por_comando: 5      # clips de la notebook por comando y hablante (aceptación)
    deteccion:              # calibrada con las 504 tomas y los 147 audios de WhatsApp (22/10)
      trama_ms: 20
      avance_ms: 10
      rango_db: 25.0
      margen_piso_db: 10.0
      dif_palabra_db: 10.0
      nivel_min_db: -55.0
      pausa_min_s: 0.20
      segmento_min_s: 0.10
      margen_borde_s: 0.03
    whatsapp:
      margen_s: 0.40        # silencio que se deja a cada lado de la palabra
      factor_doble: 1.6
    ruido:
      clips_por_archivo: 10
      particiones:          # archivos de data/voz/notebook/ruido, sin extensión
        train: [ruido_20261017_142802, ruido_20261020_085405, ruido_20261020_092822]
        val: [ruido_20261020_093611]
        test: [ruido_20261020_094933]
    tts:                    # edge-tts; solo en train
      voces: [es-AR-ElenaNeural, es-AR-TomasNeural, es-UY-ValentinaNeural, es-UY-MateoNeural,
              es-CL-CatalinaNeural, es-CL-LorenzoNeural, es-MX-DaliaNeural, es-MX-JorgeNeural,
              es-ES-ElviraNeural, es-ES-AlvaroNeural, es-CO-SalomeNeural, es-CO-GonzaloNeural]
      velocidades: ["-10%", "+10%"]
      otros: [conocer, salida, identidad]

metas:                      # plan de desarrollo, sección 1.3
  identificacion_min: 0.95
  far_max: 0.05
  frr_max: 0.10
  silhouette_min: 0.50
  voz_acierto_min: 0.90
  voz_otro_aceptado_max: 0.05
